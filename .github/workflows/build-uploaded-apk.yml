            --location \
            --retry 3 \
            -H "X-Builder-Secret: ${{ secrets.HOSTINGER_CALLBACK_SECRET }}" \
            -F "job_id=$JOB_ID" \
            -F "status=success" \
            -F "action_url=$ACTION_URL" \
            -F "apk=@/tmp/apkbuild/app-debug.apk;type=application/vnd.android.package-archive" \
            "$CALLBACK_URL"

          echo "APK enviado."

      - name: Informar falha à Hostinger
        if: steps.compile.outputs.result != 'success'
        shell: bash
        run: |
          MSG=$(tail -c 5000 /tmp/apkbuild/error.txt 2>/dev/null || \
            echo "Falha desconhecida durante a compilação.")

          curl \
            --fail \
            --location \
            --retry 3 \
            -H "X-Builder-Secret: ${{ secrets.HOSTINGER_CALLBACK_SECRET }}" \
            -F "job_id=$JOB_ID" \
            -F "status=error" \
            -F "action_url=$ACTION_URL" \
            -F "message=$MSG" \
            "$CALLBACK_URL"
